name: tests

# 放到 deep-search-agent 仓库的 .github/workflows/tests.yml 才会生效。
# 仓库的 tests/test_guards.py 全部围绕执行层护栏（危险 SQL、工作区越界、坏 PDF），
# 不依赖真实模型与外部检索服务，因此不需要任何 secret。
# 若将来加了需要 TAVILY_API_KEY / RAGFLOW 的用例，再拆成两个 job。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run guard tests
        run: pytest -q
